<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
            <title>Yulgang Paper RPG - วิถีจอมยุทธ์ของภู</title>
                <style>
                        * { box-sizing: border-box; font-family: 'Tahoma', sans-serif; }
                                body { 
                                            background: #0b0f12; /* สีครามเข้มแบบสำนักจอมยุทธ์ */
                                                        color: #e0e0e0;
                                                                    display: flex; justify-content: center; align-items: center;
                                                                                min-height: 100vh; margin: 0; padding: 15px;
                                                                                        }
                                                                                                #game-container {
                                                                                                            width: 100%; max-width: 450px;
                                                                                                                        background: #1a2228;
                                                                                                                                    border: 2px solid #cd9b42; /* ขอบสีทอง */
                                                                                                                                                border-radius: 15px;
                                                                                                                                                            padding: 20px;
                                                                                                                                                                        box-shadow: 0 0 25px rgba(205, 155, 66, 0.3);
                                                                                                                                                                                    position: relative;
                                                                                                                                                                                            }
                                                                                                                                                                                                    .header { text-align: center; border-bottom: 1px solid #cd9b42; padding-bottom: 10px; margin-bottom: 15px; }
                                                                                                                                                                                                            .header h2 { color: #cd9b42; margin: 5px 0; font-size: 1.4em; text-shadow: 1px 1px #000; }
                                                                                                                                                                                                                    
                                                                                                                                                                                                                            #log {
                                                                                                                                                                                                                                        background: #000;
                                                                                                                                                                                                                                                    border: 1px solid #3a4750;
                                                                                                                                                                                                                                                                height: 180px; padding: 15px; border-radius: 8px;
                                                                                                                                                                                                                                                                            overflow-y: auto; margin-bottom: 15px;
                                                                                                                                                                                                                                                                                        font-size: 0.95em; line-height: 1.6; color: #b8c6cf;
                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                        .status-grid {
                                                                                                                                                                                                                                                                                                                    display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
                                                                                                                                                                                                                                                                                                                                margin-bottom: 15px; background: #252e35; padding: 10px; border-radius: 8px;
                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                                                .stat-item { font-weight: bold; font-size: 0.9em; }
                                                                                                                                                                                                                                                                                                                                                        .val { color: #f4d03f; }

                                                                                                                                                                                                                                                                                                                                                                .btn-group { display: flex; flex-direction: column; gap: 10px; }
                                                                                                                                                                                                                                                                                                                                                                        button {
                                                                                                                                                                                                                                                                                                                                                                                    background: linear-gradient(to bottom, #cd9b42, #8e6d2e);
                                                                                                                                                                                                                                                                                                                                                                                                color: #fff; border: 1px solid #5d4a21;
                                                                                                                                                                                                                                                                                                                                                                                                            padding: 14px; border-radius: 6px; font-weight: bold;
                                                                                                                                                                                                                                                                                                                                                                                                                        cursor: pointer; font-size: 1em; text-shadow: 1px 1px 2px #000;
                                                                                                                                                                                                                                                                                                                                                                                                                                    transition: 0.2s; -webkit-tap-highlight-color: transparent;
                                                                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                                                                                    button:active { transform: scale(0.96); filter: brightness(1.2); }
                                                                                                                                                                                                                                                                                                                                                                                                                                                            .btn-heal { background: linear-gradient(to bottom, #2ecc71, #27ae60); }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                </style>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                </head>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                <body>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div id="game-container">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="header">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <h2>⚔️ Yulgang Paper</h2>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div id="job-title" style="font-size: 0.8em; color: #4ecca3;">ศิษย์ใหม่แห่งยุทธภพ</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div id="log">คุณมาถึง "พรรคฮอนบัล" ลมโชยพัดผ่านพร้อมกลิ่นไอแห่งการต่อสู้... เลือกวิถีของจอมยุทธ์ได้เลย!</div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="status-grid">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="stat-item">❤️ พลังกาย: <span id="hp" class="val">100</span></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="stat-item">🧘 ปราณ: <span id="chi" class="val">50</span></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="stat-item">💰 เงินสลึง: <span id="money" class="val">0</span></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="stat-item">📈 เลเวล: <span id="lv" class="val">1</span></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="btn-group">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <button onclick="action('hunt')">🌲 ออกล่ามอนสเตอร์ (เก็บเลเวล)</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <button class="btn-heal" onclick="action('rest')">🍵 โคจรพลังปราณ (พักผ่อน)</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <button onclick="action('upgrade')" style="background: #34495e;">💎 เสริมพลังอาวุธ</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        let stats = { hp: 100, chi: 50, money: 0, lv: 1 };

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            function updateUI(msg) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    document.getElementById('log').innerHTML += `<br>> ${msg}`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            document.getElementById('log').scrollTop = document.getElementById('log').scrollHeight;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    document.getElementById('hp').innerText = stats.hp;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            document.getElementById('chi').innerText = stats.chi;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    document.getElementById('money').innerText = stats.money;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            document.getElementById('lv').innerText = stats.lv;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    function action(type) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if (stats.hp <= 0) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        updateUI("<span style='color:red;'>คุณบาดเจ็บสาหัส! โปรดพักผ่อน</span>");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if (type === 'hunt') {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                let roll = Math.random();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if (roll > 0.4) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            let gain = Math.floor(Math.random() * 50) + 10;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            stats.money += gain;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            stats.chi += 5;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            updateUI(`กำจัด "แมวป่า" สำเร็จ! ได้รับ ${gain} สลึง`);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        } else {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        let dmg = Math.floor(Math.random() * 20) + 5;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        stats.hp -= dmg;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        updateUI(`พลาดท่าโดน "หมาป่าขนเหล็ก" กัด! เสียเลือด ${dmg}`);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            } else if (type === 'rest') {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        stats.hp = Math.min(100, stats.hp + 30);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    stats.chi = Math.min(100, stats.chi + 10);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                updateUI("นั่งสมาธิใต้ต้นท้อ... พลังกายฟื้นคืนมาแล้ว");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        } else if (type === 'upgrade') {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if (stats.money >= 50) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    stats.money -= 50;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    stats.lv += 1;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    updateUI("<span style='color:#f1c40f;'>ตีบวกสำเร็จ! อาวุธเปล่งประกายแสงสีทอง</span>");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                } else {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                updateUI("เงินสลึงไม่เพียงพอ (ต้องใช้ 50 สลึง)");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </script>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </html>
