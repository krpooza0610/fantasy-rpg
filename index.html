<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
            <title>แรงงานไทยในเกาหลี - Live Chat</title>
                <style>
                        * { box-sizing: border-box; margin: 0; padding: 0; }
                                body { font-family: sans-serif; background-color: #f0f2f5; height: 100vh; display: flex; flex-direction: column; }

                                        /* Header */
                                                .header { 
                                                            background: #003366; color: white; padding: 15px; 
                                                                        display: flex; justify-content: space-between; align-items: center;
                                                                                }
                                                                                        .online-count { background: #ff4757; padding: 2px 8px; border-radius: 12px; font-size: 12px; font-weight: bold; }

                                                                                                /* Main Layout */
                                                                                                        .main-content { flex: 1; display: flex; overflow: hidden; position: relative; }

                                                                                                                /* Chat Area */
                                                                                                                        .chat-box { flex: 1; display: flex; flex-direction: column; background: white; }
                                                                                                                                #chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
                                                                                                                                        
                                                                                                                                                .msg { max-width: 80%; padding: 8px 12px; border-radius: 15px; font-size: 14px; position: relative; }
                                                                                                                                                        .msg.other { background: #e4e6eb; align-self: flex-start; }
                                                                                                                                                                .msg.me { background: #003366; color: white; align-self: flex-end; }
                                                                                                                                                                        .user-name { font-size: 10px; color: #888; margin-bottom: 2px; }

                                                                                                                                                                                /* Sidebar (Right) */
                                                                                                                                                                                        .sidebar { width: 150px; background: #fff; border-left: 1px solid #ddd; padding: 10px; display: block; }
                                                                                                                                                                                                @media (max-width: 600px) { .sidebar { display: none; } } /* ซ่อนบนมือถือ */
                                                                                                                                                                                                        .online-user { font-size: 12px; margin-bottom: 8px; color: #2ecc71; display: flex; align-items: center; gap: 5px; }
                                                                                                                                                                                                                .online-user::before { content: '●'; }

                                                                                                                                                                                                                        /* Input Area */
                                                                                                                                                                                                                                .input-area { padding: 15px; background: white; border-top: 1px solid #ddd; display: flex; gap: 10px; }
                                                                                                                                                                                                                                        input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 20px; outline: none; }
                                                                                                                                                                                                                                                button { background: #003366; color: white; border: none; padding: 0 20px; border-radius: 20px; font-weight: bold; cursor: pointer; }

                                                                                                                                                                                                                                                        .aura-text { font-size: 12px; color: #d4af37; text-shadow: 0 0 5px rgba(212, 175, 55, 0.5); }
                                                                                                                                                                                                                                                            </style>
                                                                                                                                                                                                                                                            </head>
                                                                                                                                                                                                                                                            <body>

                                                                                                                                                                                                                                                            <div class="header">
                                                                                                                                                                                                                                                                <div>
                                                                                                                                                                                                                                                                        <h3 style="font-size: 16px;">แรงงานไทยในเกาหลี</h3>
                                                                                                                                                                                                                                                                                <span class="aura-text">✨ เราจะรวยไปด้วยกัน</span>
                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                        <div class="online-count">🟢 Online: <span id="count">124</span></div>
                                                                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                                                        <div class="main-content">
                                                                                                                                                                                                                                                                                            <div class="chat-box">
                                                                                                                                                                                                                                                                                                    <div id="chat-messages">
                                                                                                                                                                                                                                                                                                                <div class="msg other">
                                                                                                                                                                                                                                                                                                                                <div class="user-name">พี่สมชาย_อันซัน</div>
                                                                                                                                                                                                                                                                                                                                                วันนี้อากาศที่โซลหนาวมากครับ รักษาสุขภาพด้วย
                                                                                                                                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                                                                                                                                        <div class="msg me">
                                                                                                                                                                                                                                                                                                                                                                                        <div class="user-name">ภู (Admin)</div>
                                                                                                                                                                                                                                                                                                                                                                                                        รับทราบครับพี่ เดี๋ยวจะคอยอัปเดตเรตเงินวอนให้นะครับ
                                                                                                                                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="input-area">
                                                                                                                                                                                                                                                                                                                                                                                                                                                        <input type="text" id="userInput" placeholder="พิมพ์ข้อความที่นี่...">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <button onclick="sendMessage()">ส่ง</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="sidebar">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <h4 style="font-size: 12px; margin-bottom: 10px; color: #666;">คนออนไลน์</h4>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="online-user">ภู (Admin)</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="online-user">พี่สมชาย</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="online-user">น้องเป้</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="online-user">K_Expert</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    function sendMessage() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const input = document.getElementById('userInput');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const chatMessages = document.getElementById('chat-messages');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if (input.value.trim() !== "") {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const newMsg = document.createElement('div');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            newMsg.className = 'msg me';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        newMsg.innerHTML = `<div class="user-name">ภู (Admin)</div>${input.value}`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    chatMessages.appendChild(newMsg);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            input.value = "";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        chatMessages.scrollTop = chatMessages.scrollHeight;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </script>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </html>
