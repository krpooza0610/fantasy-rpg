<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ไทยในเกาหลี</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;700&display=swap" rel="stylesheet">
<style>
:root { --primary: #2e1a94; --bg: #ffffff; --light-purple: #f3f0ff; }
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Chakra Petch', sans-serif; }
body { background: var(--bg); padding-bottom: 140px; }

/* Header ดีไซน์เดิม */
.header { background: var(--primary); color: white; padding: 20px 15px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 50; }
.header-title { font-size: 20px; font-weight: bold; }
.header-sub { font-size: 12px; opacity: 0.7; }

/* Filter แถบเลื่อน */
.filter-wrap { display: flex; gap: 10px; overflow-x: auto; padding: 15px; white-space: nowrap; -webkit-overflow-scrolling: touch; background: white; }
.filter-btn { padding: 8px 20px; border-radius: 25px; border: none; background: #f0f2f5; font-size: 14px; color: #444; cursor: pointer; }
.filter-btn.active { background: var(--primary); color: white; }

/* Post Card ดีไซน์เหมือนในรูป */
.post-card { padding: 15px; border-bottom: 1px solid #eee; position: relative; }
.post-header { display: flex; gap: 12px; align-items: center; margin-bottom: 10px; }
.post-avatar { width: 45px; height: 45px; border-radius: 50%; background: #e0e0e0; display: flex; align-items: center; justify-content: center; font-weight: bold; overflow: hidden; }
.post-avatar img { width: 100%; height: 100%; object-fit: cover; }
.post-info b { font-size: 16px; display: flex; align-items: center; gap: 5px; }
.post-time { font-size: 12px; color: #888; }
.post-cat-tag { font-size: 11px; background: var(--light-purple); color: var(--primary); padding: 2px 8px; border-radius: 10px; margin-top: 4px; display: inline-block; }
.post-content h3 { font-size: 18px; margin: 10px 0 5px; color: #222; }
.post-content p { font-size: 15px; color: #444; line-height: 1.4; }
.post-image { width: 100%; border-radius: 10px; margin-top: 10px; }

/* Bottom Nav & Level Bar */
.bottom-fixed-wrap { position: fixed; bottom: 0; width: 100%; background: white; border-top: 1px solid #eee; z-index: 100; }
.level-bar-container { padding: 10px 15px 5px; }
.level-info { display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 4px; font-weight: bold; }
.progress-bg { width: 100%; height: 6px; background: #eee; border-radius: 10px; overflow: hidden; }
.progress-fill { width: 30%; height: 100%; background: linear-gradient(90deg, #6a11cb 0%, #2575fc 100%); }

.bottom-nav { display: flex; justify-content: space-around; align-items: center; height: 70px; padding-bottom: 10px; }
.nav-item { text-align: center; font-size: 11px; color: #888; flex: 1; text-decoration: none; }
.nav-item.active { color: var(--primary); font-weight: bold; }
.nav-item i { font-size: 24px; display: block; margin-bottom: 2px; }

/* ปุ่มบวกตรงกลาง */
.nav-post-btn { width: 60px; height: 60px; background: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 30px; margin-top: -35px; border: 5px solid white; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }

/* หน้า Login */
#login-page { position: fixed; inset: 0; background: var(--primary); z-index: 200; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; padding: 20px; }
.login-btn { width: 100%; max-width: 280px; padding: 15px; border-radius: 30px; border: none; font-weight: bold; margin-top: 15px; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer; }

.page { display: none; }
.page.active { display: block; }
</style>
</head>
<body>

<div id="login-page">
    <h1 style="font-size: 32px; margin-bottom: 5px;">ไทยในเกาหลี</h1>
        <p style="opacity: 0.8; margin-bottom: 40px;">Thais in Korea</p>
            <button class="login-btn" style="background: white; color: #444;" onclick="loginGoogle()">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20"> เข้าด้วย Google
                        </button>
                            <button class="login-btn" style="background: rgba(255,255,255,0.2); color: white; border: 1px solid white;" onclick="loginGuest()">เข้าใช้งานแบบ Guest</button>
                            </div>

                            <div id="home-page" class="page">
                                <div class="header">
                                        <div style="font-size: 24px;">⬅️</div>
                                                <div style="text-align: center;">
                                                            <div class="header-title">ไทยในเกาหลี</div>
                                                                        <div class="header-sub">Thais in Korea</div>
                                                                                </div>
                                                                                        <div style="font-size: 24px;">🔔</div>
                                                                                            </div>

                                                                                                <div class="filter-wrap">
                                                                                                        <button class="filter-btn active" onclick="filterPosts('ทั้งหมด', this)">ทั้งหมด (All)</button>
                                                                                                                <button class="filter-btn" onclick="filterPosts('ประกาศ', this)">공지사항 (ประกาศ)</button>
                                                                                                                        <button class="filter-btn" onclick="filterPosts('ทั่วไป', this)">생활정보 (ทั่วไป)</button>
                                                                                                                            </div>

                                                                                                                                <div id="post-feed"></div>
                                                                                                                                </div>

                                                                                                                                <div id="post-page" class="page" style="padding: 20px;">
                                                                                                                                    <h2 style="margin-bottom: 20px;">สร้างโพสต์ใหม่</h2>
                                                                                                                                        <select id="postCat" style="width:100%; padding:12px; margin-bottom:10px; border-radius:10px; border:1px solid #ddd;">
                                                                                                                                                <option value="ทั่วไป">ทั่วไป</option>
                                                                                                                                                        <option value="ประกาศ">ประกาศ</option>
                                                                                                                                                            </select>
                                                                                                                                                                <input type="text" id="postTitle" placeholder="หัวข้อ" style="width:100%; padding:12px; margin-bottom:10px; border-radius:10px; border:1px solid #ddd;">
                                                                                                                                                                    <textarea id="postDetail" placeholder="เนื้อหา..." style="width:100%; height:150px; padding:12px; margin-bottom:10px; border-radius:10px; border:1px solid #ddd;"></textarea>
                                                                                                                                                                        <input type="text" id="postImageUrl" placeholder="ลิงก์รูปภาพ (ถ้ามี)" style="width:100%; padding:12px; margin-bottom:20px; border-radius:10px; border:1px solid #ddd;">
                                                                                                                                                                            <button onclick="submitPost()" style="width:100%; background:var(--primary); color:white; padding:15px; border:none; border-radius:15px; font-weight:bold;">ลงโพสต์</button>
                                                                                                                                                                                <button onclick="showPage('home-page')" style="width:100%; background:none; color: #888; border:none; margin-top:15px;">ยกเลิก</button>
                                                                                                                                                                                </div>

                                                                                                                                                                                <div id="profile-page" class="page" style="padding: 40px 20px; text-align: center;">
                                                                                                                                                                                    <div id="prof-img-large" style="width:100px; height:100px; border-radius:50%; background:#eee; margin: 0 auto 20px; display:flex; align-items:center; justify-content:center; font-size:40px; overflow:hidden;"></div>
                                                                                                                                                                                        <h2 id="prof-name">User Name</h2>
                                                                                                                                                                                            <p id="prof-status" style="color: #888; margin-bottom: 30px;"></p>
                                                                                                                                                                                                <button onclick="logout()" style="padding: 12px 30px; border-radius: 20px; border: 1px solid red; color: red; background: none;">ออกจากระบบ</button>
                                                                                                                                                                                                </div>

                                                                                                                                                                                                <div class="bottom-fixed-wrap" id="bottom-bar" style="display:none;">
                                                                                                                                                                                                    <div class="level-bar-container">
                                                                                                                                                                                                            <div class="level-info"><span>Lv.1</span><span style="color: #888;">30/100</span></div>
                                                                                                                                                                                                                    <div class="progress-bg"><div class="progress-fill"></div></div>
                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                            <nav class="bottom-nav">
                                                                                                                                                                                                                                    <div class="nav-item active" id="nav-home" onclick="showPage('home-page')">🏠<br>หน้าหลัก</div>
                                                                                                                                                                                                                                            <div class="nav-item">📁<br>หมวดหมู่</div>
                                                                                                                                                                                                                                                    <div class="nav-post-btn" onclick="showPage('post-page')">+</div>
                                                                                                                                                                                                                                                            <div class="nav-item">🔍<br>ค้นหา</div>
                                                                                                                                                                                                                                                                    <div class="nav-item" id="nav-profile" onclick="showPage('profile-page')">👤<br>โปรไฟล์</div>
                                                                                                                                                                                                                                                                        </nav>
                                                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                                        <script type="module">
                                                                                                                                                                                                                                                                        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
                                                                                                                                                                                                                                                                        import { getDatabase, ref, push, onChildAdded, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
                                                                                                                                                                                                                                                                        import { getAuth, signInWithPopup, GoogleAuthProvider, signInAnonymously, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

                                                                                                                                                                                                                                                                        const firebaseConfig = {
                                                                                                                                                                                                                                                                          apiKey: "AIzaSyAaUWvOllKDx7zFf_YxfNTPo8HnRW158Mc",
                                                                                                                                                                                                                                                                            authDomain: "thai-korea-app.firebaseapp.com",
                                                                                                                                                                                                                                                                              databaseURL: "https://thai-korea-app-default-rtdb.firebaseio.com",
                                                                                                                                                                                                                                                                                projectId: "thai-korea-app",
                                                                                                                                                                                                                                                                                  storageBucket: "thai-korea-app.firebasestorage.app",
                                                                                                                                                                                                                                                                                    messagingSenderId: "962758734967",
                                                                                                                                                                                                                                                                                      appId: "1:962758734967:web:d6e5e972efbd647bf94272"
                                                                                                                                                                                                                                                                                      };

                                                                                                                                                                                                                                                                                      const app = initializeApp(firebaseConfig);
                                                                                                                                                                                                                                                                                      const db = getDatabase(app);
                                                                                                                                                                                                                                                                                      const auth = getAuth(app);
                                                                                                                                                                                                                                                                                      const provider = new GoogleAuthProvider();

                                                                                                                                                                                                                                                                                      let currentUser = null;
                                                                                                                                                                                                                                                                                      let allPosts = [];

                                                                                                                                                                                                                                                                                      window.loginGoogle = () => signInWithPopup(auth, provider).catch(e => alert(e.message));
                                                                                                                                                                                                                                                                                      window.loginGuest = () => signInAnonymously(auth).catch(e => alert(e.message));
                                                                                                                                                                                                                                                                                      window.logout = () => confirm("ต้องการออกจากระบบ?") && signOut(auth).then(() => location.reload());

                                                                                                                                                                                                                                                                                      onAuthStateChanged(auth, (user) => {
                                                                                                                                                                                                                                                                                          if (user) {
                                                                                                                                                                                                                                                                                                  currentUser = {
                                                                                                                                                                                                                                                                                                              uid: user.uid,
                                                                                                                                                                                                                                                                                                                          name: user.displayName || "Guest_" + user.uid.substring(0,4),
                                                                                                                                                                                                                                                                                                                                      photo: user.photoURL || ""
                                                                                                                                                                                                                                                                                                                                              };
                                                                                                                                                                                                                                                                                                                                                      document.getElementById('login-page').style.display = 'none';
                                                                                                                                                                                                                                                                                                                                                              document.getElementById('home-page').classList.add('active');
                                                                                                                                                                                                                                                                                                                                                                      document.getElementById('bottom-bar').style.display = 'block';
                                                                                                                                                                                                                                                                                                                                                                              updateProfileUI();
                                                                                                                                                                                                                                                                                                                                                                                  } else {
                                                                                                                                                                                                                                                                                                                                                                                          document.getElementById('login-page').style.display = 'flex';
                                                                                                                                                                                                                                                                                                                                                                                                  document.getElementById('bottom-bar').style.display = 'none';
                                                                                                                                                                                                                                                                                                                                                                                                      }
                                                                                                                                                                                                                                                                                                                                                                                                      });

                                                                                                                                                                                                                                                                                                                                                                                                      function updateProfileUI() {
                                                                                                                                                                                                                                                                                                                                                                                                          document.getElementById('prof-name').innerText = currentUser.name;
                                                                                                                                                                                                                                                                                                                                                                                                              document.getElementById('prof-status').innerText = currentUser.photo ? "บัญชี Google" : "บัญชี Guest";
                                                                                                                                                                                                                                                                                                                                                                                                                  const imgDiv = document.getElementById('prof-img-large');
                                                                                                                                                                                                                                                                                                                                                                                                                      if(currentUser.photo) imgDiv.innerHTML = `<img src="${currentUser.photo}" style="width:100%;">`;
                                                                                                                                                                                                                                                                                                                                                                                                                          else imgDiv.innerText = currentUser.name.charAt(0);
                                                                                                                                                                                                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                                                                                                                                                                                                          window.showPage = (id) => {
                                                                                                                                                                                                                                                                                                                                                                                                                              document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
                                                                                                                                                                                                                                                                                                                                                                                                                                  document.getElementById(id).classList.add('active');
                                                                                                                                                                                                                                                                                                                                                                                                                                      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
                                                                                                                                                                                                                                                                                                                                                                                                                                          if(id === 'home-page') document.getElementById('nav-home').classList.add('active');
                                                                                                                                                                                                                                                                                                                                                                                                                                              if(id === 'profile-page') document.getElementById('nav-profile').classList.add('active');
                                                                                                                                                                                                                                                                                                                                                                                                                                              };

                                                                                                                                                                                                                                                                                                                                                                                                                                              window.submitPost = () => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                  const title = document.getElementById('postTitle').value;
                                                                                                                                                                                                                                                                                                                                                                                                                                                      const detail = document.getElementById('postDetail').value;
                                                                                                                                                                                                                                                                                                                                                                                                                                                          const img = document.getElementById('postImageUrl').value;
                                                                                                                                                                                                                                                                                                                                                                                                                                                              const cat = document.getElementById('postCat').value;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                  if (title && detail && currentUser) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                          push(ref(db, "posts"), { title, detail, img, cat, author: currentUser.name, photo: currentUser.photo, uid: currentUser.uid, time: Date.now() })
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  .then(() => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              document.getElementById('postTitle').value = "";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          document.getElementById('postDetail').value = "";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      showPage('home-page');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  };

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  onChildAdded(ref(db, "posts"), (data) => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      const post = { id: data.key, ...data.val() };
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          allPosts.unshift(post);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              renderPosts(allPosts);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              });

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              function renderPosts(posts) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  const feed = document.getElementById('post-feed');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      feed.innerHTML = "";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          posts.forEach(p => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  const avatar = p.photo ? `<img src="${p.photo}">` : p.author.charAt(0);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          const imgHtml = p.img ? `<img src="${p.img}" class="post-image">` : '';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  const delBtn = (currentUser && p.uid === currentUser.uid) ? `<span onclick="deletePost('${p.id}')" style="float:right; color:#ccc;">🗑️</span>` : '';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  const html = `
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <div class="post-card">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              ${delBtn}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <div class="post-header">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <div class="post-avatar">${avatar}</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <div class="post-info">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <b>${p.author} <span style="font-size:12px;">🐾</span></b>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <div class="post-cat-tag">${p.cat}</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <div style="margin-left:auto; font-size:11px; color:#aaa;">${new Date(p.time).toLocaleDateString()}</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <div class="post-content">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <h3>${p.title}</h3>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <p>${p.detail}</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          ${imgHtml}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <div style="margin-top:15px; display:flex; gap:20px; color:#888; font-size:14px;">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <span>❤️ 0</span> <span>💬 0</span>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          </div>`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  feed.insertAdjacentHTML('beforeend', html);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      window.deletePost = (id) => confirm("ลบโพสต์นี้?") && remove(ref(db, "posts/" + id)).then(() => location.reload());

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      window.filterPosts = (category, btn) => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              btn.classList.add('active');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  renderPosts(category === 'ทั้งหมด' ? allPosts : allPosts.filter(p => p.cat === category));
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  };
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </html>
