<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ไทยในเกาหลี</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;700&display=swap" rel="stylesheet">
<style>
/* --- ตั้งค่าสีและฟอนต์หลัก --- */
:root { --primary: #2e1a94; --accent: #ffd700; --bg: #f5f6f8; }
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Chakra Petch', sans-serif; }
body { background: var(--bg); padding-bottom: 160px; }

/* --- 1. ส่วนหัว (Header) --- */
.main-header { background: var(--primary); color: white; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
.logo-zone b { font-size: 18px; display: block; line-height: 1.1; }
.logo-zone span { font-size: 10px; color: var(--accent); text-shadow: 0 0 8px rgba(255,215,0,0.6); font-weight: bold; }

/* --- 2. ห้องแชทสด (ลดขนาด 10% เหลือ 50vh) --- */
.shoutbox-container { background: white; margin: 15px; border-radius: 12px; padding: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
#shout-display { height: 50vh; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; padding: 5px; font-size: 13px; }
.shout-msg { background: #f8f9fa; padding: 8px 12px; border-radius: 8px; border-left: 3px solid var(--primary); }

/* --- 3. แถบหมวดหมู่ --- */
.cat-scroll { display: flex; gap: 10px; overflow-x: auto; padding: 10px 15px; background: white; border-bottom: 1px solid #eee; white-space: nowrap; }
.cat-item { padding: 6px 18px; border-radius: 20px; background: #eee; font-size: 14px; cursor: pointer; border: none; }
.cat-item.active { background: var(--primary); color: white; }

/* --- 4. ระบบโพสต์และคอมเมนต์ --- */
.post-card { background: white; padding: 15px; border-bottom: 1px solid #eee; position: relative; }
.post-time { position: absolute; top: 15px; right: 15px; font-size: 11px; color: #aaa; }
.user-avatar { width: 40px; height: 40px; border-radius: 50%; background: #eee; overflow: hidden; }
.user-avatar img { width: 100%; height: 100%; object-fit: cover; }
.post-tag { font-size: 11px; background: #f0f2ff; color: var(--primary); padding: 2px 8px; border-radius: 4px; }
.post-actions { display: flex; gap: 20px; margin-top: 15px; padding-top: 10px; border-top: 1px solid #f9f9f9; }
.action-btn { background: none; border: none; color: #666; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 5px; }

/* หน้าคอมเมนต์ */
.comment-section { margin-top: 15px; background: #fcfcfc; padding: 10px; border-radius: 8px; display: none; }
.comment-item { font-size: 13px; border-bottom: 1px solid #eee; padding: 8px 0; }

/* --- 5. เมนูล่างและหลอด EXP --- */
.fixed-bottom { position: fixed; bottom: 0; width: 100%; background: white; z-index: 1000; border-top: 1px solid #eee; }
.exp-fill { width: 30%; height: 100%; background: linear-gradient(90deg, #6a11cb, #2575fc); }
.nav-grid { display: flex; justify-content: space-around; align-items: center; height: 65px; }
.create-btn { width: 55px; height: 55px; background: var(--primary); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; margin-top: -35px; border: 4px solid white; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }

.page { display: none; }
.page.active { display: block; }
#login-page { position: fixed; inset: 0; background: var(--primary); z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; }
</style>
</head>
<body>

<div id="login-page">
    <h1>ไทยในเกาหลี</h1>
        <p style="opacity: 0.7; margin-bottom: 40px;">เราจะรวยไปด้วยกัน</p>
            <button onclick="loginGoogle()" style="width: 80%; max-width: 250px; padding: 15px; border-radius: 30px; border: none; background: white; font-weight: bold;">เข้าสู่ระบบด้วย Google</button>
            </div>

            <div id="home-page" class="page">
                <header class="main-header">
                        <div class="logo-zone"><b>แรงงานไทยในเกาหลี</b><span>เราจะรวยไปด้วยกัน</span></div>
                                <div class="notif-icon">🔔</div>
                                    </header>

                                        <div class="shoutbox-container">
                                                <div id="shout-display"></div>
                                                        <div class="shout-input-wrap">
                                                                    <input type="text" id="shoutInput" placeholder="แชทสด...">
                                                                                <button onclick="sendShout()">ส่ง</button>
                                                                                        </div>
                                                                                            </div>

                                                                                                <div class="cat-scroll">
                                                                                                        <button class="cat-item active" onclick="filterPosts('ทั้งหมด', this)">ทั้งหมด</button>
                                                                                                                <button class="cat-item" onclick="filterPosts('หางาน', this)">หางาน</button>
                                                                                                                        <button class="cat-item" onclick="filterPosts('ทั่วไป', this)">ทั่วไป</button>
                                                                                                                                <button class="cat-item" onclick="filterPosts('ประกาศ', this)">ประกาศ</button>
                                                                                                                                    </div>
                                                                                                                                        <div id="post-feed"></div>
                                                                                                                                        </div>

                                                                                                                                        <div id="post-page" class="page" style="padding: 20px;">
                                                                                                                                            <h2>สร้างโพสต์ใหม่</h2>
                                                                                                                                                <select id="pCat" style="width:100%; padding:10px; margin-top:10px; border-radius:8px;">
                                                                                                                                                        <option value="ทั่วไป">หมวดหมู่: ทั่วไป</option>
                                                                                                                                                                <option value="หางาน">หมวดหมู่: หางาน</option>
                                                                                                                                                                        <option value="ประกาศ">หมวดหมู่: ประกาศ</option>
                                                                                                                                                                            </select>
                                                                                                                                                                                <input type="text" id="pTitle" placeholder="หัวข้อ..." style="width:100%; padding:12px; margin: 15px 0; border-radius: 8px; border: 1px solid #ddd;">
                                                                                                                                                                                    <textarea id="pDetail" placeholder="รายละเอียด..." style="width:100%; height:150px; padding:12px; border-radius: 8px; border: 1px solid #ddd;"></textarea>
                                                                                                                                                                                        <button onclick="savePost()" style="width:100%; padding:15px; background:var(--primary); color:white; border:none; border-radius:10px; font-weight:bold;">ลงประกาศ</button>
                                                                                                                                                                                        </div>

                                                                                                                                                                                        <div class="fixed-bottom" id="bottom-bar" style="display:none;">
                                                                                                                                                                                            <div class="level-wrap"><div class="level-info">Lv.1 <div class="exp-bar-bg"><div class="exp-fill"></div></div> 30/100</div></div>
                                                                                                                                                                                                <nav class="nav-grid">
                                                                                                                                                                                                        <div class="nav-btn active" onclick="showPage('home-page')">🏠<br>หน้าหลัก</div>
                                                                                                                                                                                                                <div class="nav-btn">📁<br>หมวดหมู่</div>
                                                                                                                                                                                                                        <div class="create-btn" onclick="showPage('post-page')">+</div>
                                                                                                                                                                                                                                <div class="nav-btn">🔍<br>ค้นหา</div>
                                                                                                                                                                                                                                        <div class="nav-btn" onclick="logout()">👤<br>โปรไฟล์</div>
                                                                                                                                                                                                                                            </nav>
                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                            <script type="module">
                                                                                                                                                                                                                                            import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
                                                                                                                                                                                                                                            import { getDatabase, ref, push, onChildAdded, update, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
                                                                                                                                                                                                                                            import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

                                                                                                                                                                                                                                            const firebaseConfig = {
                                                                                                                                                                                                                                              apiKey: "AIzaSyAaUWvOllKDx7zFf_YxfNTPo8HnRW158Mc",
                                                                                                                                                                                                                                                authDomain: "thai-korea-app.firebaseapp.com",
                                                                                                                                                                                                                                                  databaseURL: "https://thai-korea-app-default-rtdb.firebaseio.com",
                                                                                                                                                                                                                                                    projectId: "thai-korea-app"
                                                                                                                                                                                                                                                    };

                                                                                                                                                                                                                                                    const app = initializeApp(firebaseConfig);
                                                                                                                                                                                                                                                    const db = getDatabase(app);
                                                                                                                                                                                                                                                    const auth = getAuth(app);
                                                                                                                                                                                                                                                    const provider = new GoogleAuthProvider();

                                                                                                                                                                                                                                                    let currentUser = null;
                                                                                                                                                                                                                                                    let allPosts = [];

                                                                                                                                                                                                                                                    onAuthStateChanged(auth, (user) => {
                                                                                                                                                                                                                                                        if (user) {
                                                                                                                                                                                                                                                                currentUser = { uid: user.uid, name: user.displayName, photo: user.photoURL };
                                                                                                                                                                                                                                                                        document.getElementById('login-page').style.display = 'none';
                                                                                                                                                                                                                                                                                document.getElementById('home-page').classList.add('active');
                                                                                                                                                                                                                                                                                        document.getElementById('bottom-bar').style.display = 'block';
                                                                                                                                                                                                                                                                                            } else {
                                                                                                                                                                                                                                                                                                    document.getElementById('login-page').style.display = 'flex';
                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                        });

                                                                                                                                                                                                                                                                                                        window.loginGoogle = () => signInWithPopup(auth, provider);
                                                                                                                                                                                                                                                                                                        window.logout = () => confirm("ออกจากระบบ?") && signOut(auth).then(() => location.reload());

                                                                                                                                                                                                                                                                                                        // --- ฟังก์ชันจัดการโพสต์ ---
                                                                                                                                                                                                                                                                                                        window.savePost = () => {
                                                                                                                                                                                                                                                                                                            const t = document.getElementById('pTitle').value;
                                                                                                                                                                                                                                                                                                                const d = document.getElementById('pDetail').value;
                                                                                                                                                                                                                                                                                                                    const c = document.getElementById('pCat').value;
                                                                                                                                                                                                                                                                                                                        if(t && d && currentUser) {
                                                                                                                                                                                                                                                                                                                                push(ref(db, "posts"), { 
                                                                                                                                                                                                                                                                                                                                            title: t, detail: d, cat: c, author: currentUser.name, uid: currentUser.uid, photo: currentUser.photo, time: Date.now(), likes: 0 
                                                                                                                                                                                                                                                                                                                                                    }).then(() => { 
                                                                                                                                                                                                                                                                                                                                                                document.getElementById('pTitle').value = ""; document.getElementById('pDetail').value = ""; showPage('home-page'); 
                                                                                                                                                                                                                                                                                                                                                                        });
                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                            };

                                                                                                                                                                                                                                                                                                                                                                            onChildAdded(ref(db, "posts"), (data) => {
                                                                                                                                                                                                                                                                                                                                                                                const post = data.val();
                                                                                                                                                                                                                                                                                                                                                                                    post.id = data.key;
                                                                                                                                                                                                                                                                                                                                                                                        allPosts.unshift(post);
                                                                                                                                                                                                                                                                                                                                                                                            renderPosts(allPosts);
                                                                                                                                                                                                                                                                                                                                                                                            });

                                                                                                                                                                                                                                                                                                                                                                                            window.filterPosts = (cat, btn) => {
                                                                                                                                                                                                                                                                                                                                                                                                document.querySelectorAll('.cat-item').forEach(b => b.classList.remove('active'));
                                                                                                                                                                                                                                                                                                                                                                                                    btn.classList.add('active');
                                                                                                                                                                                                                                                                                                                                                                                                        const filtered = cat === 'ทั้งหมด' ? allPosts : allPosts.filter(p => p.cat === cat);
                                                                                                                                                                                                                                                                                                                                                                                                            renderPosts(filtered);
                                                                                                                                                                                                                                                                                                                                                                                                            };

                                                                                                                                                                                                                                                                                                                                                                                                            window.renderPosts = (posts) => {
                                                                                                                                                                                                                                                                                                                                                                                                                const feed = document.getElementById('post-feed');
                                                                                                                                                                                                                                                                                                                                                                                                                    feed.innerHTML = "";
                                                                                                                                                                                                                                                                                                                                                                                                                        posts.forEach(p => {
                                                                                                                                                                                                                                                                                                                                                                                                                                const isOwner = currentUser && p.uid === currentUser.uid;
                                                                                                                                                                                                                                                                                                                                                                                                                                        const html = `
                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="post-card" id="post-${p.id}">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <span class="post-time">${new Date(p.time).toLocaleTimeString()}</span>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="post-user">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="user-avatar"><img src="${p.photo || ''}"></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div><b>${p.author}</b><br><span class="post-tag">${p.cat}</span></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <h3>${p.title}</h3><p>${p.detail}</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="post-actions">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <button class="action-btn" onclick="likePost('${p.id}')">❤️ ${p.likes || 0}</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <button class="action-btn" onclick="toggleComments('${p.id}')">💬 ตอบกลับ</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        ${isOwner ? `<button class="action-btn" style="color:red;" onclick="deletePost('${p.id}')">ลบ</button>` : ''}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="comment-section" id="comments-${p.id}">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div id="comment-list-${p.id}"></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <input type="text" id="input-${p.id}" placeholder="เขียนคอมเมนต์..." style="width:80%;">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <button onclick="addComment('${p.id}')">ส่ง</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        feed.insertAdjacentHTML('beforeend', html);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            };

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            window.likePost = (id) => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const post = allPosts.find(p => p.id === id);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    update(ref(db, `posts/${id}`), { likes: (post.likes || 0) + 1 });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        location.reload(); // รีโหลดเพื่ออัปเดตเลขชั่วคราว
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        };

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        window.deletePost = (id) => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if(confirm("ยืนยันการลบโพสต์?")) remove(ref(db, `posts/${id}`)).then(() => location.reload());
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            };

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            window.toggleComments = (id) => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const sec = document.getElementById(`comments-${id}`);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    sec.style.display = sec.style.display === 'block' ? 'none' : 'block';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    };

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    window.addComment = (id) => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const text = document.getElementById(`input-${id}`).value;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if(text) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    push(ref(db, `posts/${id}/comments`), { author: currentUser.name, text: text, time: Date.now() })
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            .then(() => { document.getElementById(`input-${id}`).value = ""; alert("ส่งคอมเมนต์แล้ว"); });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                };

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                window.showPage = (id) => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        document.getElementById(id).classList.add('active');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        };
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </html>
