<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ไทยในเกาหลี</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;700&display=swap" rel="stylesheet">
<style>
:root { --primary: #2e1a94; --accent: #ffd700; --bg: #f5f6f8; }
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Chakra Petch', sans-serif; }
body { background: var(--bg); padding-bottom: 160px; }
.main-header { background: var(--primary); color: white; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
.logo-zone b { font-size: 18px; display: block; line-height: 1.1; }
.logo-zone span { font-size: 10px; color: var(--accent); text-shadow: 0 0 8px rgba(255,215,0,0.6); font-weight: bold; }
.shoutbox-container { background: white; margin: 15px; border-radius: 12px; padding: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); position: relative; }
#shout-display { height: 50vh; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; padding: 5px; font-size: 13px; }
.shout-msg { background: #f8f9fa; padding: 8px 12px; border-radius: 8px; border-left: 3px solid var(--primary); }
.shout-input-wrap { display: flex; gap: 8px; }
.shout-input-wrap input { flex: 1; border: 1px solid #ddd; padding: 10px 15px; border-radius: 20px; font-size: 13px; }
.cat-scroll { display: flex; gap: 10px; overflow-x: auto; padding: 10px 15px; background: white; border-bottom: 1px solid #eee; }
.cat-item { padding: 6px 18px; border-radius: 20px; background: #eee; font-size: 14px; cursor: pointer; border: none; }
.cat-item.active { background: var(--primary); color: white; }
.post-card { background: white; padding: 15px; border-bottom: 1px solid #eee; position: relative; cursor: pointer; }
.post-user { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.user-avatar { width: 40px; height: 40px; border-radius: 50%; background: #eee; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.user-avatar img { width: 100%; height: 100%; object-fit: cover; }
.post-tag { font-size: 11px; background: #f0f2ff; color: var(--primary); padding: 2px 8px; border-radius: 4px; }
.post-actions { display: flex; gap: 20px; margin-top: 15px; padding-top: 10px; border-top: 1px solid #f9f9f9; }
.action-btn { background: none; border: none; color: #666; font-size: 13px; display: flex; align-items: center; gap: 5px; }
#full-post-view { display: none; position: fixed; inset: 0; background: white; z-index: 3000; overflow-y: auto; padding-bottom: 80px; }
.full-post-header { padding: 15px; display: flex; align-items: center; gap: 15px; border-bottom: 1px solid #eee; background: white; position: sticky; top: 0; }
.cmt-wrap { margin-top: 10px; background: #fcfcfc; padding: 10px; border-radius: 8px; border: 1px solid #eee; }
.cmt-item { font-size: 12px; border-bottom: 1px solid #f0f0f0; padding: 8px 0; }
.cmt-input-box { display: flex; gap: 5px; margin-top: 10px; padding: 10px; background: white; position: sticky; bottom: 0; border-top: 1px solid #eee; }
.fixed-bottom { position: fixed; bottom: 0; width: 100%; background: white; z-index: 1000; border-top: 1px solid #eee; }
.exp-fill { width: 30%; height: 100%; background: linear-gradient(90deg, #6a11cb, #2575fc); }
.nav-grid { display: flex; justify-content: space-around; align-items: center; height: 65px; }
.create-btn { width: 55px; height: 55px; background: var(--primary); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; margin-top: -35px; border: 4px solid white; }
.page { display: none; }
.page.active { display: block; }
#login-page { position: fixed; inset: 0; background: var(--primary); z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; }
</style>
</head>
<body>
<div id="login-page">
    <h1>ไทยในเกาหลี</h1><p style="opacity: 0.7; margin-bottom: 40px;">เราจะรวยไปด้วยกัน</p>
        <button onclick="loginGoogle()" style="width: 80%; max-width: 250px; padding: 15px; border-radius: 30px; border: none; font-weight: bold;">เข้าสู่ระบบด้วย Google</button>
        </div>
        <div id="full-post-view">
            <div class="full-post-header"><div onclick="closeFullPost()" style="font-size:24px; cursor:pointer;">←</div><b>ดูโพสต์</b></div>
                <div id="full-post-content"></div>
                </div>
                <div id="home-page" class="page">
                    <header class="main-header"><div class="logo-zone"><b>แรงงานไทยในเกาหลี</b><span>เราจะรวยไปด้วยกัน</span></div><div>🔔</div></header>
                        <div class="shoutbox-container"><div id="shout-display"></div><div class="shout-input-wrap"><input type="text" id="shoutInput" placeholder="แชทสด..."><button onclick="sendShout()">ส่ง</button></div></div>
                            <div class="cat-scroll">
                                    <button class="cat-item active" onclick="filterPosts('ทั้งหมด', this)">ทั้งหมด</button>
                                            <button class="cat-item" onclick="filterPosts('หางาน', this)">หางาน</button>
                                                    <button class="cat-item" onclick="filterPosts('ทั่วไป', this)">ทั่วไป</button>
                                                            <button class="cat-item" onclick="filterPosts('ประกาศ', this)">ประกาศ</button>
                                                                </div>
                                                                    <div id="post-feed"></div>
                                                                    </div>
                                                                    <div id="post-page" class="page" style="padding: 20px;">
                                                                        <h2>สร้างโพสต์</h2>
                                                                            <select id="pCat" style="width:100%; padding:10px; margin-top:10px; border-radius:8px;"><option value="ทั่วไป">ทั่วไป</option><option value="หางาน">หางาน</option><option value="ประกาศ">ประกาศ</option></select>
                                                                                <input type="text" id="pTitle" placeholder="หัวข้อ..." style="width:100%; padding:12px; margin: 15px 0; border-radius:8px;">
                                                                                    <textarea id="pDetail" placeholder="รายละเอียด..." style="width:100%; height:150px; padding:12px; border-radius:8px;"></textarea>
                                                                                        <button onclick="savePost()" style="width:100%; padding:15px; background:var(--primary); color:white; border-radius:10px; font-weight:bold; margin-top:20px;">ลงประกาศ</button>
                                                                                        </div>
                                                                                        <div class="fixed-bottom" id="bottom-bar" style="display:none;">
                                                                                            <div class="level-wrap"><div class="level-info">Lv.1 <div class="exp-bar-bg"><div class="exp-fill"></div></div> 30/100</div></div>
                                                                                                <nav class="nav-grid">
                                                                                                        <div onclick="showPage('home-page')">🏠<br>หน้าหลัก</div>
                                                                                                                <div>📁<br>หมวดหมู่</div>
                                                                                                                        <div class="create-btn" onclick="showPage('post-page')">+</div>
                                                                                                                                <div>🔍<br>ค้นหา</div>
                                                                                                                                        <div onclick="logout()">👤<br>โปรไฟล์</div>
                                                                                                                                            </nav>
                                                                                                                                        </div>
                                                                                                                                        <script type="module">
                                                                                                                                            import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
                                                                                                                                            import { getDatabase, ref, push, onChildAdded, onValue, update, remove, onChildChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
                                                                                                                                            import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

                                                                                                                                            const firebaseConfig = {
                                                                                                                                              apiKey: "AIzaSyAaUWvOllKDx7zFf_YxfNTPo8HnRW158Mc", 
                                                                                                                                                authDomain: "thai-korea-app.firebaseapp.com",
                                                                                                                                                  databaseURL: "https://thai-korea-app-default-rtdb.firebaseio.com",
                                                                                                                                                    projectId: "thai-korea-app"
                                                                                                                                                    };

                                                                                                                                                    const app = initializeApp(firebaseConfig);
                                                                                                                                                    const db = getDatabase(app);
                                                                                                                                                    const auth = getAuth(app);
                                                                                                                                                    const provider = new GoogleAuthProvider();

                                                                                                                                                    let currentUser = null;
                                                                                                                                                    let allPosts = [];

                                                                                                                                                    onAuthStateChanged(auth, (user) => {
                                                                                                                                                        if (user) {
                                                                                                                                                                currentUser = { uid: user.uid, name: user.displayName, photo: user.photoURL };
                                                                                                                                                                        document.getElementById('login-page').style.display = 'none';
                                                                                                                                                                                document.getElementById('home-page').classList.add('active');
                                                                                                                                                                                        document.getElementById('bottom-bar').style.display = 'block';
                                                                                                                                                                                            } else {
                                                                                                                                                                                                    document.getElementById('login-page').style.display = 'flex';
                                                                                                                                                                                                            document.getElementById('bottom-bar').style.display = 'none';
                                                                                                                                                                                                                }
                                                                                                                                                                                                                });

                                                                                                                                                                                                                window.loginGoogle = () => signInWithPopup(auth, provider);
                                                                                                                                                                                                                window.logout = () => confirm("ออกจากระบบ?") && signOut(auth).then(() => location.reload());

                                                                                                                                                                                                                window.sendShout = () => {
                                                                                                                                                                                                                    const input = document.getElementById('shoutInput');
                                                                                                                                                                                                                        if(input.value.trim() && currentUser) {
                                                                                                                                                                                                                                push(ref(db, "chats"), { name: currentUser.name, text: input.value, time: Date.now() });
                                                                                                                                                                                                                                        input.value = "";
                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                            };
                                                                                                                                                                                                                                            onChildAdded(ref(db, "chats"), (data) => {
                                                                                                                                                                                                                                                const m = data.val();
                                                                                                                                                                                                                                                    const html = `<div class="shout-msg"><b>${m.name}:</b> ${m.text}</div>`;
                                                                                                                                                                                                                                                        const display = document.getElementById('shout-display');
                                                                                                                                                                                                                                                            display.insertAdjacentHTML('beforeend', html);
                                                                                                                                                                                                                                                                display.scrollTop = display.scrollHeight;
                                                                                                                                                                                                                                                                });
window.savePost = () => {
        const t = document.getElementById('pTitle').value;
            const d = document.getElementById('pDetail').value;
                const c = document.getElementById('pCat').value;
                    if(t && d && currentUser) {
                            push(ref(db, "posts"), { title: t, detail: d, cat: c, author: currentUser.name, uid: currentUser.uid, photo: currentUser.photo, time: Date.now(), likes: 0 });
                                    document.getElementById('pTitle').value = ""; document.getElementById('pDetail').value = "";
                                            showPage('home-page');
                                                }
                                                };

                                                onChildAdded(ref(db, "posts"), (data) => {
                                                    const p = data.val(); p.id = data.key;
                                                        allPosts.unshift(p); renderPosts(allPosts);
                                                        });

                                                        onChildChanged(ref(db, "posts"), (data) => {
                                                            const updated = data.val(); updated.id = data.key;
                                                                allPosts = allPosts.map(p => p.id === data.key ? updated : p);
                                                                    renderPosts(allPosts);
                                                                        if(document.getElementById('full-post-view').style.display === 'block') openFullPost(updated.id);
                                                                        });

                                                                        function renderPosts(posts) {
                                                                            const feed = document.getElementById('post-feed'); feed.innerHTML = "";
                                                                                posts.forEach(p => {
                                                                                        const isOwner = currentUser && p.uid === currentUser.uid;
                                                                                                feed.insertAdjacentHTML('beforeend', `
                                                                                                            <div class="post-card">
                                                                                                                            <div onclick="openFullPost('${p.id}')">
                                                                                                                                                <div class="post-user"><div class="user-avatar">${p.photo ? `<img src="${p.photo}">` : p.author.charAt(0)}</div>
                                                                                                                                                                    <div><b>${p.author} 🐾</b><br><span class="post-tag">${p.cat}</span></div></div>
                                                                                                                                                                                        <h3>${p.title}</h3><p style="color:#555; font-size:14px;">${p.detail.substring(0, 80)}...</p>
                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                        <div class="post-actions">
                                                                                                                                                                                                                                            <button class="action-btn" onclick="likePost('${p.id}', ${p.likes || 0})">❤️ ${p.likes || 0}</button>
                                                                                                                                                                                                                                                                <button class="action-btn" onclick="openFullPost('${p.id}')">💬 ตอบกลับ</button>
                                                                                                                                                                                                                                                                                    ${isOwner ? `<button class="action-btn" style="color:red;" onclick="deletePost('${p.id}')">ลบ</button>` : ''}
                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                                </div>`);
                                                                                                                                                                                                                                                                                                                    });
                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                    window.openFullPost = (id) => {
                                                                                                                                                                                                                                                                                                                        const p = allPosts.find(item => item.id === id); if(!p) return;
                                                                                                                                                                                                                                                                                                                            const isOwner = currentUser && p.uid === currentUser.uid;
                                                                                                                                                                                                                                                                                                                                document.getElementById('full-post-content').innerHTML = `
                                                                                                                                                                                                                                                                                                                                        <div style="padding: 20px;">
                                                                                                                                                                                                                                                                                                                                                    <div class="post-user"><div class="user-avatar">${p.photo ? `<img src="${p.photo}">` : p.author.charAt(0)}</div><div><b>${p.author}</b><br><span>${p.cat}</span></div></div>
                                                                                                                                                                                                                                                                                                                                                                <h2 style="margin:15px 0;">${p.title}</h2><p style="white-space: pre-wrap;">${p.detail}</p>
                                                                                                                                                                                                                                                                                                                                                                            <div class="post-actions" style="border-bottom:1px solid #eee; padding-bottom:15px;">
                                                                                                                                                                                                                                                                                                                                                                                            <button class="action-btn" onclick="likePost('${p.id}', ${p.likes || 0})">❤️ ${p.likes || 0}</button>
                                                                                                                                                                                                                                                                                                                                                                                                            ${isOwner ? `<button class="action-btn" style="color:red;" onclick="deletePost('${p.id}'); closeFullPost();">ลบ</button>` : ''}
                                                                                                                                                                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                    <div id="full-cmt-list" style="margin-top:20px;"></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="cmt-input-box"><input type="text" id="full-in" placeholder="เขียนคอมเมนต์..."><button onclick="sendFullCmt('${p.id}')">ส่ง</button></div>`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                        document.getElementById('full-post-view').style.display = 'block';
                                                                                                                                                                                                                                                                                                                                                                                                                                                            onValue(ref(db, `posts/${id}/comments`), (snap) => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const list = document.getElementById('full-cmt-list'); if(!list) return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                            list.innerHTML = "<b>ความคิดเห็น:</b>";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    snap.forEach(c => { const v = c.val(); list.insertAdjacentHTML('beforeend', `<div class="cmt-item"><b>${v.author}:</b> ${v.text}</div>`); });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        };

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        window.closeFullPost = () => document.getElementById('full-post-view').style.display = 'none';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        window.sendFullCmt = (id) => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const input = document.getElementById('full-in');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if(input.value.trim() && currentUser) { push(ref(db, `posts/${id}/comments`), { author: currentUser.name, text: input.value, time: Date.now() }); input.value = ""; }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                };
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                window.filterPosts = (cat, btn) => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    document.querySelectorAll('.cat-item').forEach(b => b.classList.remove('active')); btn.classList.add('active');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        renderPosts(cat === 'ทั้งหมด' ? allPosts : allPosts.filter(p => p.cat === cat));
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        };
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        window.likePost = (id, cur) => update(ref(db, `posts/${id}`), { likes: cur + 1 });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        window.deletePost = (id) => confirm("ลบโพสต์?") && remove(ref(db, `posts/${id}`)).then(()=>location.reload());
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        window.showPage = (id) => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            document.querySelectorAll('.page').forEach(p => p.classList.remove('active')); document.getElementById(id).classList.add('active');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            };
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </html>
                                                                                                                                                                                                                                                                                                                    
}
