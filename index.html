<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ไทยในเกาหลี - เวอร์ชั่นจัดระเบียบ</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;700&display=swap" rel="stylesheet">
<style>
/* --- ตั้งค่าสีและฟอนต์หลัก --- */
:root { --primary: #2e1a94; --accent: #ffd700; --bg: #f5f6f8; }
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Chakra Petch', sans-serif; }
body { background: var(--bg); padding-bottom: 120px; overflow-x: hidden; }

/* --- ส่วนหัว (Header) --- */
.main-header { background: var(--primary); color: white; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
.logo-zone b { font-size: 18px; display: block; line-height: 1.1; }
.logo-zone span { font-size: 10px; color: var(--accent); font-weight: bold; }

/* --- ระบบแชทสด (Shoutbox) --- */
.shoutbox-container { background: white; margin: 15px; border-radius: 12px; padding: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
#shout-display { height: 35vh; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
.shout-msg { background: #f8f9fa; padding: 8px 12px; border-radius: 8px; border-left: 4px solid var(--primary); font-size: 14px; }

/* --- แถบเลเวลและเมนูล่าง --- */
.fixed-bottom { position: fixed; bottom: 0; width: 100%; background: white; z-index: 1000; border-top: 1px solid #eee; }
.level-wrap { padding: 10px 15px 5px; }
.exp-bar-bg { width: 100%; height: 8px; background: #e0e0e0; border-radius: 10px; overflow: hidden; margin-top: 5px; }
.exp-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #6a11cb, #2575fc); transition: width 0.5s ease; }

/* --- ปุ่มเมนู --- */
.nav-grid { display: flex; justify-content: space-around; align-items: center; height: 60px; text-align: center; font-size: 11px; }
.nav-btn { color: #888; cursor: pointer; flex: 1; }
.nav-btn.active { color: var(--primary); font-weight: bold; }
.create-btn { width: 50px; height: 50px; background: var(--primary); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; margin-top: -30px; border: 4px solid white; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }

/* --- หน้าจอแต่ละหน้า --- */
.page { display: none; }
.page.active { display: block; }
#login-page { position: fixed; inset: 0; background: var(--primary); z-index: 5000; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; }
</style>
</head>
<body>
<div id="login-page">
    <h1>ไทยในเกาหลี</h1>
    <button onclick="loginGoogle()" style="margin-top:20px; padding:15px 30px; border-radius:30px; border:none; font-weight:bold; cursor:pointer;">เข้าสู่ระบบด้วย Google</button>
    </div>

    <div id="home-page" class="page active">
    <header class="main-header">
    <div class="logo-zone"><b>แรงงานไทยในเกาหลี</b><span>เราจะรวยไปด้วยกัน</span></div>
    <div>🔔</div>
    </header>
    <div class="shoutbox-container">
    <div id="shout-display"></div>
    <div style="display:flex; gap:8px;">
    <input type="text" id="shoutInput" placeholder="คุยกันสดๆ..." style="flex:1; padding:10px; border-radius:20px; border:1px solid #ddd; outline:none;">
    <button onclick="sendShout()" style="background:var(--primary); color:white; border:none; padding:0 15px; border-radius:20px;">ส่ง</button>
    </div>
    </div>
    <div id="post-feed"></div>
    </div>

    <div id="post-page" class="page">
    <header class="main-header"><b>สร้างโพสต์ใหม่</b></header>
    <div style="padding:15px;">
    <input type="text" id="pTitle" placeholder="หัวข้อ" style="width:100%; padding:12px; margin-bottom:10px; border:1px solid #ddd; border-radius:8px;">
    <textarea id="pDetail" placeholder="รายละเอียด..." style="width:100%; height:150px; padding:12px; border:1px solid #ddd; border-radius:8px;"></textarea>
    <button onclick="savePost()" style="width:100%; padding:15px; background:var(--primary); color:white; border:none; border-radius:8px; margin-top:10px; font-weight:bold;">ลงประกาศ (+10 EXP)</button>
    </div>
    </div>

    <div class="fixed-bottom" id="bottom-bar" style="display:none;">
    <div class="level-wrap">
    <div style="display:flex; justify-content:space-between; font-size:12px; font-weight:bold;">
    <span>Lv.<span id="u-lv">1</span></span>
    <span>EXP: <span id="u-exp">0</span>/100</span>
    </div>
    <div class="exp-bar-bg"><div id="exp-fill" class="exp-fill"></div></div>
    </div>
    <nav class="nav-grid">
    <div class="nav-btn active" onclick="showPage('home-page', this)">🏠<br>หน้าหลัก</div>
    <div class="nav-btn">📁<br>หมวดหมู่</div>
    <div class="nav-btn" onclick="showPage('post-page', this)"><div class="create-btn">+</div></div>
    <div class="nav-btn">🔍<br>ค้นหา</div>
    <div class="nav-btn">👤<br>โปรไฟล์</div>
    </nav>
    </div>
  <script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, push, onChildAdded, onValue, update, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
  import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

  // --- ตั้งค่าเชื่อมต่อ Firebase ---
  const firebaseConfig = {
  apiKey: "AIzaSyAaUWvOllKDx7zFf_YxfNTPo8HnRW158Mc",
  authDomain: "thai-korea-app.firebaseapp.com",
  databaseURL: "https://thai-korea-app-default-rtdb.firebaseio.com",
  projectId: "thai-korea-app"
  };
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const auth = getAuth(app);
  const provider = new GoogleAuthProvider();
  let currentUser = null;

  // --- ระบบเพิ่มแต้ม EXP ---
  async function addExp(points) {
  if(!currentUser) return;
  const userRef = ref(db, `users/${currentUser.uid}`);
  const snapshot = await get(userRef);
  let userData = snapshot.val() || { exp: 0, lv: 1 };
  userData.exp += points;
  if(userData.exp >= 100) {
  userData.lv += 1;
  userData.exp -= 100;
  alert("ยินดีด้วย! คุณเลเวลอัพเป็น Lv." + userData.lv);
  }
  update(userRef, userData);
  }

  // --- ตรวจสอบการล็อกอิน ---
  onAuthStateChanged(auth, (user) => {
  if (user) {
  currentUser = user;
  document.getElementById('login-page').style.display = 'none';
  document.getElementById('bottom-bar').style.display = 'block';
  onValue(ref(db, `users/${user.uid}`), (snap) => {
  const d = snap.val() || { exp: 0, lv: 1 };
  document.getElementById('u-lv').innerText = d.lv;
  document.getElementById('u-exp').innerText = d.exp;
  document.getElementById('exp-fill').style.width = d.exp + '%';
  });
  } else {
  document.getElementById('login-page').style.display = 'flex';
  }
  });

  // --- การส่งแชทสด ---
  window.sendShout = () => {
  const input = document.getElementById('shoutInput');
  if(input.value && currentUser) {
  push(ref(db, "chats"), { name: currentUser.displayName, text: input.value, time: Date.now() });
  addExp(1);
  input.value = "";
  }
  };

  onChildAdded(ref(db, "chats"), (data) => {
  const m = data.val();
  const box = document.getElementById('shout-display');
  box.insertAdjacentHTML('beforeend', `<div class="shout-msg"><b>${m.name}:</b> ${m.text}</div>`);
  box.scrollTop = box.scrollHeight;
  });

  // --- การเปลี่ยนหน้าเมนู ---
  window.showPage = (id, btn) => {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  };

  // --- ฟังก์ชันเสริม ---
  window.loginGoogle = () => signInWithPopup(auth, provider);
  window.savePost = () => {
  const t = document.getElementById('pTitle').value;
  const d = document.getElementById('pDetail').value;
  if(t && d && currentUser) {
  push(ref(db, "posts"), { title: t, detail: d, author: currentUser.displayName, time: Date.now() });
  addExp(10);
  showPage('home-page');
  }
  };
  </script>
  </body>
  </html>
