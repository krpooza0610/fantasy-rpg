<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ไทยในเกาหลี</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;700&display=swap" rel="stylesheet">
<style>
/* --- ตั้งค่าสีและฟอนต์หลัก --- */
:root { --primary: #2e1a94; --accent: #ffd700; --bg: #f5f6f8; }
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Chakra Petch', sans-serif; }
body { background: var(--bg); padding-bottom: 160px; }

/* --- 1. ส่วนหัว (Header) --- */
.main-header { 
background: var(--primary); 
color: white; 
padding: 10px 15px; 
display: flex; 
justify-content: space-between; 
align-items: center; 
position: sticky; 
top: 0; 
z-index: 100; 
}
.logo-zone b { font-size: 18px; display: block; line-height: 1.1; }
.logo-zone span { font-size: 10px; color: var(--accent); text-shadow: 0 0 8px rgba(255,215,0,0.6); font-weight: bold; }
.notif-icon { font-size: 20px; cursor: pointer; }

/* --- 2. ห้องแชทสด (ปรับลดขนาดลง 10%) --- */
.shoutbox-container { 
background: white; 
margin: 15px; 
border-radius: 12px; 
padding: 12px; 
box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
position: relative; 
}
.shout-header { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 8px; color: #666; border-bottom: 1px solid #f0f0f0; padding-bottom: 5px; }
.online-count { color: #2ecc71; font-weight: bold; }
#shout-display { 
height: 50vh; /* ปรับลดจาก 60vh เหลือ 50vh ตามที่ต้องการ */
overflow-y: auto; 
display: flex; 
flex-direction: column; 
gap: 8px; 
margin-bottom: 10px; 
padding: 5px; 
font-size: 13px; 
}
.shout-msg { background: #f8f9fa; padding: 8px 12px; border-radius: 8px; border-left: 3px solid var(--primary); }
.shout-input-wrap { display: flex; gap: 8px; }
.shout-input-wrap input { flex: 1; border: 1px solid #ddd; padding: 10px 15px; border-radius: 20px; font-size: 13px; outline: none; }

/* --- 3. แถบหมวดหมู่ --- */
.cat-scroll { display: flex; gap: 10px; overflow-x: auto; padding: 10px 15px; background: white; border-bottom: 1px solid #eee; white-space: nowrap; -webkit-overflow-scrolling: touch; }
.cat-item { padding: 6px 18px; border-radius: 20px; background: #eee; font-size: 14px; cursor: pointer; border: none; }
.cat-item.active { background: var(--primary); color: white; }

/* --- 4. การ์ดโพสต์ --- */
.post-card { background: white; padding: 15px; border-bottom: 1px solid #eee; position: relative; }
.post-user { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.user-avatar { width: 40px; height: 40px; border-radius: 50%; background: #eee; display: flex; align-items: center; justify-content: center; font-weight: bold; overflow: hidden; }
.user-avatar img { width: 100%; height: 100%; object-fit: cover; }
.post-time { position: absolute; top: 15px; right: 15px; font-size: 11px; color: #aaa; }
.post-tag { font-size: 11px; background: #f0f2ff; color: var(--primary); padding: 2px 8px; border-radius: 4px; display: inline-block; margin-top: 2px; }
.post-actions { display: flex; gap: 20px; margin-top: 15px; padding-top: 10px; border-top: 1px solid #f9f9f9; }
.action-btn { background: none; border: none; color: #666; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 5px; }

/* --- 5. เมนูล่างและหลอด EXP --- */
.fixed-bottom { position: fixed; bottom: 0; width: 100%; background: white; z-index: 1000; border-top: 1px solid #eee; }
.level-wrap { padding: 8px 15px 5px; }
.level-info { display: flex; align-items: center; gap: 10px; font-size: 12px; font-weight: bold; }
.exp-bar-bg { flex: 1; height: 6px; background: #eee; border-radius: 10px; overflow: hidden; }
.exp-fill { width: 30%; height: 100%; background: linear-gradient(90deg, #6a11cb, #2575fc); }
.nav-grid { display: flex; justify-content: space-around; align-items: center; height: 65px; padding-bottom: 5px; }
.nav-btn { text-align: center; font-size: 11px; color: #888; flex: 1; cursor: pointer; }
.nav-btn.active { color: var(--primary); font-weight: bold; }
.create-btn { width: 55px; height: 55px; background: var(--primary); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; margin-top: -35px; border: 4px solid white; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }

.page { display: none; }
.page.active { display: block; }
#login-page { position: fixed; inset: 0; background: var(--primary); z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; }
</style>
</head>
<body>

<div id="login-page">
    <h1 style="margin-bottom: 5px;">ไทยในเกาหลี</h1>
        <p style="opacity: 0.7; margin-bottom: 40px;">เราจะรวยไปด้วยกัน</p>
            <button onclick="loginGoogle()" style="width: 80%; max-width: 250px; padding: 15px; border-radius: 30px; border: none; background: white; font-weight: bold; cursor: pointer;">เข้าสู่ระบบด้วย Google</button>
            </div>

            <div id="home-page" class="page">
                <header class="main-header">
                        <div class="logo-zone">
                                    <b>แรงงานไทยในเกาหลี</b>
                                                <span>เราจะรวยไปด้วยกัน</span>
                                                        </div>
                                                                <div class="notif-icon">🔔</div>
                                                                    </header>

                                                                        <div class="shoutbox-container">
                                                                                <div class="shout-header">
                                                                                            <span>แชทสด</span>
                                                                                                        <span class="online-count">🟢 ออนไลน์: <span id="online-users">1</span></span>
                                                                                                                </div>
                                                                                                                        <div id="shout-display"></div>
                                                                                                                                <div class="shout-input-wrap">
                                                                                                                                            <input type="text" id="shoutInput" placeholder="พิมพ์ข้อความแชท...">
                                                                                                                                                        <button onclick="sendShout()" style="border:none; background:none; font-size:20px;">ส่ง</button>
                                                                                                                                                                </div>
                                                                                                                                                                    </div>

                                                                                                                                                                        <div class="cat-scroll">
                                                                                                                                                                                <button class="cat-item active" onclick="filterPosts('ทั้งหมด', this)">ทั้งหมด</button>
                                                                                                                                                                                        <button class="cat-item" onclick="filterPosts('หางาน', this)">หางาน</button>
                                                                                                                                                                                                <button class="cat-item" onclick="filterPosts('ทั่วไป', this)">ทั่วไป</button>
                                                                                                                                                                                                        <button class="cat-item" onclick="filterPosts('ประกาศ', this)">ประกาศ</button>
                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                <div id="post-feed" class="feed-container"></div>
                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                <div id="post-page" class="page" style="padding: 20px;">
                                                                                                                                                                                                                    <h2>สร้างโพสต์ใหม่</h2>
                                                                                                                                                                                                                        <input type="text" id="pTitle" placeholder="หัวข้อ..." style="width:100%; padding:12px; margin: 15px 0; border-radius: 8px; border: 1px solid #ddd;">
                                                                                                                                                                                                                            <textarea id="pDetail" placeholder="รายละเอียด..." style="width:100%; height:150px; padding:12px; border-radius: 8px; border: 1px solid #ddd;"></textarea>
                                                                                                                                                                                                                                <button onclick="savePost()" style="width:100%; padding:15px; background:var(--primary); color:white; border:none; border-radius:10px; font-weight:bold; margin-top:20px;">ลงประกาศ</button>
                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                <div class="fixed-bottom" id="bottom-bar" style="display:none;">
                                                                                                                                                                                                                                    <div class="level-wrap">
                                                                                                                                                                                                                                            <div class="level-info">Lv.1 <div class="exp-bar-bg"><div class="exp-fill"></div></div> 30/100</div>
                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                    <nav class="nav-grid">
                                                                                                                                                                                                                                                            <div class="nav-btn active" onclick="showPage('home-page')">🏠<br>หน้าหลัก</div>
                                                                                                                                                                                                                                                                    <div class="nav-btn">📁<br>หมวดหมู่</div>
                                                                                                                                                                                                                                                                            <div class="create-btn" onclick="showPage('post-page')">+</div>
                                                                                                                                                                                                                                                                                    <div class="nav-btn">🔍<br>ค้นหา</div>
                                                                                                                                                                                                                                                                                            <div class="nav-btn" onclick="logout()">👤<br>โปรไฟล์</div>
                                                                                                                                                                                                                                                                                                </nav>
                                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                                <script type="module">
                                                                                                                                                                                                                                                                                                import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
                                                                                                                                                                                                                                                                                                import { getDatabase, ref, push, onChildAdded, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
                                                                                                                                                                                                                                                                                                import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

                                                                                                                                                                                                                                                                                                // --- ตรวจสอบ API Key ให้ถูกต้องจากหน้า Console ของ Firebase ---
                                                                                                                                                                                                                                                                                                const firebaseConfig = {
                                                                                                                                                                                                                                                                                                  apiKey: "AIzaSyAaUWvOllKDx7zFf_YxfNTPo8HnRW158Mc", 
                                                                                                                                                                                                                                                                                                    authDomain: "thai-korea-app.firebaseapp.com",
                                                                                                                                                                                                                                                                                                      databaseURL: "https://thai-korea-app-default-rtdb.firebaseio.com",
                                                                                                                                                                                                                                                                                                        projectId: "thai-korea-app",
                                                                                                                                                                                                                                                                                                          storageBucket: "thai-korea-app.firebasestorage.app",
                                                                                                                                                                                                                                                                                                            messagingSenderId: "962758734967",
                                                                                                                                                                                                                                                                                                              appId: "1:962758734967:web:d6e5e972efbd647bf94272"
                                                                                                                                                                                                                                                                                                              };

                                                                                                                                                                                                                                                                                                              const app = initializeApp(firebaseConfig);
                                                                                                                                                                                                                                                                                                              const db = getDatabase(app);
                                                                                                                                                                                                                                                                                                              const auth = getAuth(app);
                                                                                                                                                                                                                                                                                                              const provider = new GoogleAuthProvider();

                                                                                                                                                                                                                                                                                                              let currentUser = null;
                                                                                                                                                                                                                                                                                                              let allPosts = [];

                                                                                                                                                                                                                                                                                                              window.loginGoogle = () => signInWithPopup(auth, provider);
                                                                                                                                                                                                                                                                                                              window.logout = () => confirm("ออกจากระบบ?") && signOut(auth).then(() => location.reload());

                                                                                                                                                                                                                                                                                                              onAuthStateChanged(auth, (user) => {
                                                                                                                                                                                                                                                                                                                  if (user) {
                                                                                                                                                                                                                                                                                                                          currentUser = { uid: user.uid, name: user.displayName, photo: user.photoURL };
                                                                                                                                                                                                                                                                                                                                  document.getElementById('login-page').style.display = 'none';
                                                                                                                                                                                                                                                                                                                                          document.getElementById('home-page').classList.add('active');
                                                                                                                                                                                                                                                                                                                                                  document.getElementById('bottom-bar').style.display = 'block';
                                                                                                                                                                                                                                                                                                                                                      } else {
                                                                                                                                                                                                                                                                                                                                                              document.getElementById('login-page').style.display = 'flex';
                                                                                                                                                                                                                                                                                                                                                                      document.getElementById('bottom-bar').style.display = 'none';
                                                                                                                                                                                                                                                                                                                                                                          }
                                                                                                                                                                                                                                                                                                                                                                          });

                                                                                                                                                                                                                                                                                                                                                                          window.sendShout = () => {
                                                                                                                                                                                                                                                                                                                                                                              const input = document.getElementById('shoutInput');
                                                                                                                                                                                                                                                                                                                                                                                  if(input.value.trim() && currentUser) {
                                                                                                                                                                                                                                                                                                                                                                                          push(ref(db, "chats"), { name: currentUser.name, text: input.value, time: Date.now() });
                                                                                                                                                                                                                                                                                                                                                                                                  input.value = "";
                                                                                                                                                                                                                                                                                                                                                                                                      }
                                                                                                                                                                                                                                                                                                                                                                                                      };

                                                                                                                                                                                                                                                                                                                                                                                                      onChildAdded(ref(db, "chats"), (data) => {
                                                                                                                                                                                                                                                                                                                                                                                                          const m = data.val();
                                                                                                                                                                                                                                                                                                                                                                                                              const timeStr = new Date(m.time).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                                                                                                                                                                                                                                                                                                                                                                                                                  const html = `<div class="shout-msg"><b>${m.name}:</b> ${m.text} <small style="float:right; opacity:0.4;">${timeStr}</small></div>`;
                                                                                                                                                                                                                                                                                                                                                                                                                      const display = document.getElementById('shout-display');
                                                                                                                                                                                                                                                                                                                                                                                                                          display.insertAdjacentHTML('beforeend', html);
                                                                                                                                                                                                                                                                                                                                                                                                                              display.scrollTop = display.scrollHeight;
                                                                                                                                                                                                                                                                                                                                                                                                                              });

                                                                                                                                                                                                                                                                                                                                                                                                                              onValue(ref(db, ".info/connected"), (snap) => {
                                                                                                                                                                                                                                                                                                                                                                                                                                  document.getElementById('online-users').innerText = Math.floor(Math.random() * 5) + 1;
                                                                                                                                                                                                                                                                                                                                                                                                                                  });

                                                                                                                                                                                                                                                                                                                                                                                                                                  window.showPage = (id) => {
                                                                                                                                                                                                                                                                                                                                                                                                                                      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
                                                                                                                                                                                                                                                                                                                                                                                                                                          document.getElementById(id).classList.add('active');
                                                                                                                                                                                                                                                                                                                                                                                                                                              document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
                                                                                                                                                                                                                                                                                                                                                                                                                                                  if(id === 'home-page') document.querySelector('.nav-btn:nth-child(1)').classList.add('active');
                                                                                                                                                                                                                                                                                                                                                                                                                                                  };

                                                                                                                                                                                                                                                                                                                                                                                                                                                  window.savePost = () => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                      const t = document.getElementById('pTitle').value;
                                                                                                                                                                                                                                                                                                                                                                                                                                                          const d = document.getElementById('pDetail').value;
                                                                                                                                                                                                                                                                                                                                                                                                                                                              if(t && d && currentUser) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                      push(ref(db, "posts"), { 
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  title: t, 
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              detail: d, 
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          author: currentUser.name, 
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      photo: currentUser.photo, 
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  time: Date.now(), 
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              cat: "ทั่วไป" 
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      }).then(() => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  document.getElementById('pTitle').value = "";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              document.getElementById('pDetail').value = "";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          showPage('home-page');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      };

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      onChildAdded(ref(db, "posts"), (data) => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          allPosts.unshift(data.val());
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              renderPosts(allPosts);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              });

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              function renderPosts(posts) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  const feed = document.getElementById('post-feed');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      feed.innerHTML = "";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          posts.forEach(p => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  const timeStr = new Date(p.time).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          const html = `
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <div class="post-card">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <span class="post-time">${timeStr}</span>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <div class="post-user">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <div class="user-avatar">${p.photo ? `<img src="${p.photo}">` : p.author.charAt(0)}</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <b>${p.author} 🐾</b><br>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <span class="post-tag">${p.cat || 'ทั่วไป'}</span>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <h3>${p.title}</h3>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <p style="color:#555; font-size:14px;">${p.detail}</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <div class="post-actions">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <button class="action-btn">❤️ ถูกใจ</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <button class="action-btn">💬 คอมเม้นต์</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      </div>`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              feed.insertAdjacentHTML('beforeend', html);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </html>
